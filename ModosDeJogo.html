    <h1><center>Modos de Jogo</center></h1>
   <center> <p>Bem-vindo aos modos de jogo do Brawl Stars! Aqui você verá informações sobre alguns dos modos de jogo disponíveis no jogo!</p> </center>

    <center><h2>Combate</h2></center>
    <p><center>Combate é um modo Battle Royale onde o objetivo é ser o ultimo jogador vivo!</center>
    <figure>
        <center><img src="showdown_icon.png" alt="Icone do Combate"></center>
        <center><figcaption>O mapa do combate é gigante, e nele possuem varias caixas de poder, ao quebra-las e coletar o cubo verde, você ganha um bônus de vida e dano
            esses cubos podem ser obtidos após derrotar jogadores também, existem moitas que escondem os jogadores, então cheque elas sempre que possivel para não ser
            pego de surpresa, e o mapa vai encolhendo com o passar do tempo, forçando os jogadores ao centro do mapa
        </figcaption></center>
    </p>

        <center><h2>Fute-Brawl</h2></center>
    <p><center>Marque 2 gols para vencer! (VALE TUDO)</center>
    <figure>
        <center><img src="brawlball.jpg" alt="Bola do Fute-Brawl"></center>
        <center><figcaption>Caso você e seus aliados estejam todos no ataquetenha certeza que o oponente não possua um personagem com alta mobilidade!
            pois brawlers assim podem facilmente pegar a bola e subir no mapa! o mapa também pode ser quebrado, então brawlers com pouco alcance podem sofrer conforme 
            o jogo progride! Você sempre usa uma munição para chutar a bola, com algumas pequenas exceções em alguns brawlers, porém você também pode chutar com sua super
            chutando a bola mais rapido e longe, perfeito para marcar gols de meio de campo quando nenhum inimigo estiver por perto!
        </figcaption></center>
    </p>

        <center><h2>Roubo</h2></center>
    <p><center>Destrua o Cofre Inimigo para vencer!</center>
    <figure>
        <center><img src="roubo.png" alt="Imagem do cofre do roubo cheio de gemas"></center>
        <center><figcaption>O cofre do modo roubo é um alvo estatico, então brawlers que possuem ataques com alto dano e longo alcance são otimas opções, como o Coronel Ruffs!
            após perder 25% de vida, o cofre ganha um escudo de invencibilidade por 3 segundos. então guarde seus ataques mais fortes quando o cofre estiver longe de um dos threesholds
            (25%, 50% e 75%) para garantir o maximo de dano possivel!
        </figcaption></center>
    </p>

        <center><h2>Duelos</h2></center>
    <p><center>O modo 1 contra 1 oficial do Brawl Stars</center>
    <figure>
        <center><img src="duels_icon.png" alt="Duelos, o modo onde vence quem tem mais skill (ou quem tem o brawler cauter do outro)"></center>
        <center><figcaption>Cada player começa com seus primeiros brawlers, quem perder avança pro segundo, quem perder com o terceiro brawler primeiro, perde.
            Tenha um trio de brawlers sempre compostos por pelo menos um assasino, um anti-assasino (brawlers que conseguem empurrar os assasinos pra tras)
            e um brawler anti-tanque, visto que matchups (confrontos entre brawlers especificos) são muito importantes nesse modo, e ter um trio balanceado é a melhor maneira
            de garantir que seu time inteiro não seja evaporado por um boneco só do inimigo!!
        </figcaption></center>
    </p>
